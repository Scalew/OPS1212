<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Map Overlays</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha26-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // 1. Initialize Map
    const map = L.map('map').setView([38.820, -77.075], 15);

    // 2. Base Layer (Using a new, reliable tile provider)
    const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // 3. Historical Map Overlays (All 19)
    const overlayMaps = {
        "1853 Map of Alexandria": L.tileLayer('https://warper.wfmlabs.org/maps/tile/62024/{z}/{x}/{y}.png', { attribution: '1853 Map of Alexandria | Map Warper' }),
        "1862 Defenses of Washington": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58950/{z}/{x}/{y}.png', { attribution: '1862 Defenses of Washington | Map Warper' }),
        "1865 Military Map": L.tileLayer('https://warper.wfmlabs.org/maps/tile/54817/{z}/{x}/{y}.png', { attribution: '1865 Military Map | Map Warper' }),
        "1878 Hopkins Map of Washington": L.tileLayer('https://warper.wfmlabs.org/maps/tile/39601/{z}/{x}/{y}.png', { attribution: '1878 Hopkins Map of Washington | Map Warper' }),
        "1879 Atlas of Alexandria": L.tileLayer('https://warper.wfmlabs.org/maps/tile/39598/{z}/{x}/{y}.png', { attribution: '1879 Atlas of Alexandria | Map Warper' }),
        "1885 Hopkins City Atlas": L.tileLayer('https://warper.wfmlabs.org/maps/tile/61845/{z}/{x}/{y}.png', { attribution: '1885 Hopkins City Atlas | Map Warper' }),
        "1892 Army Map Service": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58951/{z}/{x}/{y}.png', { attribution: '1892 Army Map Service | Map Warper' }),
        "1894 US Coast Survey": L.tileLayer('https://warper.wfmlabs.org/maps/tile/4397/{z}/{x}/{y}.png', { attribution: '1894 US Coast Survey | Map Warper' }),
        "1900 Landowner Map": L.tileLayer('https://warper.wfmlabs.org/maps/tile/4747/{z}/{x}/{y}.png', { attribution: '1900 Landowner Map | Map Warper' }),
        "1907 Baist Real Estate Atlas": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58963/{z}/{x}/{y}.png', { attribution: '1907 Baist Real Estate Atlas | Map Warper' }),
        "1917 U.S. Geo Survey": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58952/{z}/{x}/{y}.png', { attribution: '1917 U.S. Geo Survey | Map Warper' }),
        "1921 Baist Real Estate Atlas": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58962/{z}/{x}/{y}.png', { attribution: '1921 Baist Real Estate Atlas | Map Warper' }),
        "1928 Dept of Interior": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58949/{z}/{x}/{y}.png', { attribution: '1928 Dept of Interior | Map Warper' }),
        "1937 Shell Oil Map": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58954/{z}/{x}/{y}.png', { attribution: '1937 Shell Oil Map | Map Warper' }),
        "1943 Army Map Service": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58948/{z}/{x}/{y}.png', { attribution: '1943 Army Map Service | Map Warper' }),
        "1944 U.S. Geo Survey": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58953/{z}/{x}/{y}.png', { attribution: '1944 U.S. Geo Survey | Map Warper' }),
        "1945 Zoning Map": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58961/{z}/{x}/{y}.png', { attribution: '1945 Zoning Map | Map Warper' }),
        "1949 Zoning Map": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58957/{z}/{x}/{y}.png', { attribution: '1949 Zoning Map | Map Warper' }),
        "1960 Master Plan of Highways": L.tileLayer('https://warper.wfmlabs.org/maps/tile/58956/{z}/{x}/{y}.png', { attribution: '1960 Master Plan of Highways | Map Warper' })
    };

    // 4. Layer Control
    const baseMaps = {
        "Modern Map": carto
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
    
    // Optional: Add one of the historical maps by default
    overlayMaps["1900 Landowner Map"].addTo(map);

</script>

</body>
</html>
